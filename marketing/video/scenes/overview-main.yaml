id: overview-main
description: Core overview demo reused by the Reddit cut
profile: default
fixture: marketing-story
source_clip: marketing/video/sources/overview-main.mp4
fallback_source_clip: docs/assets/videos/1.mp4
capture:
  duration: 11.6
  clean_background: true
  background_color: "#F7F5EF"
  background_image: marketing/video/assets/video-background.JPG
  hide_cursor: true
prepare_urls:
  - set-setting?key=showHUD&value=true
  - set-setting?key=showShortcutInHUD&value=true
prepare_before_launch:
  - { type: quit-app, bundle_id: com.apple.TextEdit }
  - { type: quit-app, bundle_id: com.apple.calculator }
  - { type: quit-app, bundle_id: com.apple.Chess }
  - { type: quit-app, bundle_id: com.apple.FontBook }
  - { type: quit-app, bundle_id: com.apple.Dictionary }
  - { type: quit-app, bundle_id: com.apple.Preview }
  - { type: quit-app, bundle_id: com.apple.Image_Capture }
  - { type: quit-app, bundle_id: com.apple.ScriptEditor2 }
  - { type: quit-app, bundle_id: com.apple.ColorSyncUtility }
  - { type: quit-app, bundle_id: com.apple.helpviewer }
  - { type: quit-app, bundle_id: com.apple.weather }
launch_apps:
  - com.apple.TextEdit
  - com.apple.calculator
  - com.apple.Dictionary
  - com.apple.Preview
  - com.apple.helpviewer
  - com.apple.FontBook
  - com.apple.Chess
  - com.apple.Image_Capture
  - com.apple.ScriptEditor2
  - com.apple.ColorSyncUtility
prepare_after_launch:
  - { type: sleep, seconds: 1.0 }
  - { type: open-file, bundle_id: com.apple.TextEdit, path: marketing/video/assets/shortcutcycle-demo.rtf }
  - { type: sleep, seconds: 0.3 }
  - { type: activate-app, bundle_id: com.apple.calculator }
  - type: osascript
    lines:
      - tell application "System Events" to tell process "Calculator" to click menu item "Scientific" of menu "View" of menu bar 1
  - { type: sleep, seconds: 0.4 }
  - { type: open-file, bundle_id: com.apple.Preview, path: marketing/video/assets/shortcutcycle-demo.pdf }
  - { type: sleep, seconds: 0.6 }
  - { type: hide-other-apps, except_bundle_ids: [com.xcv58.ShortcutCycle.dev, com.apple.TextEdit, com.apple.calculator, com.apple.helpviewer, com.apple.FontBook, com.apple.Dictionary, com.apple.Preview, com.apple.Chess, com.apple.Image_Capture, com.apple.ScriptEditor2, com.apple.ColorSyncUtility] }
window_layouts:
  "com.apple.TextEdit": [190, 58, 1510, 990]
  "com.apple.calculator": [720, 82, 880, 955]
  "com.apple.Dictionary": [185, 62, 1505, 995]
  "com.apple.Preview": [175, 72, 1490, 960]
  "com.apple.helpviewer": [150, 58, 1540, 995]
  "com.apple.FontBook": [190, 62, 1510, 1000]
  "com.apple.Chess": [230, 86, 1460, 930]
  "com.apple.Image_Capture": [220, 82, 1460, 930]
  "com.apple.ScriptEditor2": [210, 76, 1480, 945]
  "com.apple.ColorSyncUtility": [200, 70, 1500, 960]
initial_frontmost_app: com.apple.calculator
actions:
  - { at: 1.00, type: shortcut-sequence, shortcut: option+1, tap_count: 3, pre_hold: 0.42, between_taps: 0.34, post_hold: 0.82, show_shortcut_overlay: true, overlay_duration: 0.95 }
  - { at: 3.95, type: shortcut-sequence, shortcut: option+3, tap_count: 3, pre_hold: 0.42, between_taps: 0.34, post_hold: 0.82, show_shortcut_overlay: true, overlay_duration: 0.95 }
  - { at: 6.90, type: shortcut-sequence, shortcut: option+1, tap_count: 2, pre_hold: 0.42, between_taps: 0.34, post_hold: 0.78, show_shortcut_overlay: true, overlay_duration: 0.95 }
  - { at: 9.55, type: shortcut-sequence, shortcut: option+3, tap_count: 2, pre_hold: 0.42, between_taps: 0.34, post_hold: 0.78, show_shortcut_overlay: true, overlay_duration: 0.95 }
trim_hints:
  - { label: full, start: 0.20, end: 11.35 }
