id: hud-story
description: Real HUD storytelling clip with a compact group and a large group
profile: default
fixture: marketing-story
source_clip: marketing/video/sources/hud-story.mp4
capture:
  duration: 12.2
  clean_background: true
  background_color: "#F7F5EF"
  background_image: marketing/video/assets/video-background.JPG
  hide_cursor: true
prepare_urls:
  - set-setting?key=showHUD&value=true
  - set-setting?key=showShortcutInHUD&value=true
prepare_before_launch:
  - { type: quit-app, bundle_id: com.apple.TextEdit }
  - { type: quit-app, bundle_id: com.apple.calculator }
  - { type: quit-app, bundle_id: com.apple.Chess }
  - { type: quit-app, bundle_id: com.apple.FontBook }
  - { type: quit-app, bundle_id: com.apple.Dictionary }
  - { type: quit-app, bundle_id: com.apple.Preview }
  - { type: quit-app, bundle_id: com.apple.Image_Capture }
  - { type: quit-app, bundle_id: com.apple.ScriptEditor2 }
  - { type: quit-app, bundle_id: com.apple.ColorSyncUtility }
  - { type: quit-app, bundle_id: com.apple.helpviewer }
  - { type: quit-app, bundle_id: com.apple.weather }
launch_apps:
  - com.apple.TextEdit
  - com.apple.calculator
  - com.apple.Dictionary
  - com.apple.Preview
  - com.apple.helpviewer
  - com.apple.FontBook
  - com.apple.Chess
  - com.apple.Image_Capture
  - com.apple.ColorSyncUtility
prepare_after_launch:
  - { type: sleep, seconds: 1.2 }
  - { type: open-file, bundle_id: com.apple.TextEdit, path: marketing/video/assets/shortcutcycle-demo.rtf }
  - { type: sleep, seconds: 0.3 }
  - { type: open-file, bundle_id: com.apple.Preview, path: marketing/video/assets/shortcutcycle-demo.pdf }
  - { type: sleep, seconds: 0.6 }
  - { type: hide-other-apps, except_bundle_ids: [com.xcv58.ShortcutCycle.dev, com.apple.TextEdit, com.apple.calculator, com.apple.helpviewer, com.apple.FontBook, com.apple.Dictionary, com.apple.Preview, com.apple.Chess, com.apple.Image_Capture, com.apple.ColorSyncUtility] }
window_layouts:
  "com.apple.TextEdit": [190, 42, 1510, 1080]
  "com.apple.calculator": [720, 82, 880, 955]
  "com.apple.Dictionary": [185, 42, 1505, 1080]
  "com.apple.Preview": [175, 42, 1490, 1080]
  "com.apple.helpviewer": [150, 42, 1540, 1080]
  "com.apple.FontBook": [190, 42, 1510, 1080]
  "com.apple.Chess": [230, 42, 1460, 1080]
  "com.apple.Image_Capture": [220, 42, 1460, 1080]
  "com.apple.ColorSyncUtility": [200, 42, 1500, 1080]
initial_frontmost_app: com.apple.calculator
actions:
  - { at: 0.95, type: shortcut-sequence, shortcut: option+1, tap_count: 2, pre_hold: 0.60, between_taps: 0.34, post_hold: 0.82, show_shortcut_overlay: true, overlay_duration: 0.95 }
  - { at: 3.45, type: shortcut-sequence, shortcut: option+5, tap_count: 3, pre_hold: 0.70, between_taps: 0.32, post_hold: 0.80, show_shortcut_overlay: true, overlay_duration: 0.95 }
  - { at: 6.35, type: shortcut-sequence, shortcut: option+1, tap_count: 2, pre_hold: 0.60, between_taps: 0.34, post_hold: 0.78, show_shortcut_overlay: true, overlay_duration: 0.95 }
  - { at: 8.95, type: shortcut-sequence, shortcut: option+5, tap_count: 4, pre_hold: 0.55, between_taps: 0.25, post_hold: 0.70, show_shortcut_overlay: true, overlay_duration: 1.55 }
