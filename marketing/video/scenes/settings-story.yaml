id: settings-story
description: Real settings walkthrough showing group selection and general preferences
profile: default
fixture: marketing-default
source_clip: marketing/video/sources/settings-story.mp4
capture:
  duration: 15.8
  clean_background: true
  background_color: "#F7F5EF"
  background_image: marketing/video/assets/video-background.JPG
  hide_cursor: true
  recording_warmup_seconds: 1.0
prepare_urls:
  - open-settings?tab=groups
  - select-group?group=Writing
prepare_after_launch:
  - { type: sleep, seconds: 1.1 }
  - { type: hide-other-apps, except_bundle_ids: [com.xcv58.ShortcutCycle.dev] }
window_stage_apps:
  - com.xcv58.ShortcutCycle.dev
window_layouts:
  "com.xcv58.ShortcutCycle.dev": [192, 96, 1536, 864]
initial_frontmost_app: com.xcv58.ShortcutCycle.dev
actions:
  - { at: 1.35, type: select-group, group: Tools, highlight_duration: 1.05 }
  - { at: 3.15, type: select-group, group: Showcase, highlight_duration: 1.05 }
  - { at: 5.05, type: open-url, url: "shortcutcycle://open-settings?tab=general", highlight_text: General, highlight_duration: 1.05 }
  - { at: 6.65, type: click-radio, group: Appearance, index: 3, highlight_duration: 1.15 }
  - { at: 8.65, type: click-control, control: Language, highlight_duration: 1.05 }
  - { at: 9.60, type: click-menu-item, title: "Japanese / 日本語", highlight_duration: 0.90, move_duration: 0.28 }
  - { at: 12.00, type: click-button, button: ショートカット, highlight_duration: 1.10 }
